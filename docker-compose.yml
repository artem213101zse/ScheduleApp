services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DEBUG: "0"
      SECRET_KEY: "${SECRET_KEY:-change-me-on-server}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      DATABASE_PATH: /app/data/db.sqlite3
      SCHEDULE_EDIT_PASSWORD: "${SCHEDULE_EDIT_PASSWORD:-rasp2026}"
      MIREA_SCHEDULE_GROUP: "${MIREA_SCHEDULE_GROUP:-БСМО-31-25}"
    volumes:
      # Живая SQLite. Положите сюда свой db.sqlite3 перед первым запуском:
      #   mkdir data
      #   copy db.sqlite3 data\db.sqlite3     (Windows)
      #   cp db.sqlite3 data/db.sqlite3       (Linux)
      - ./data:/app/data
