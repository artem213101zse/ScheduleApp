{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>{% block title %}Журнал студента{% endblock %}</title>
    <link rel="icon" href="{% static 'journal/logo.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'journal/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'journal/app.css' %}">
    <link rel="stylesheet" href="{% static 'journal/auth.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="phone">
    {% block content %}{% endblock %}
</div>
{% block extra_js %}{% endblock %}
</body>
</html>
